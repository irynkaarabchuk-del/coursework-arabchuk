<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Адмін-панель — Organick</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="icon" type="image/png" href="assets/images/logo.svg" />
    <link rel="stylesheet" href="assets/css/admin.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header class="main-header">
      <nav class="navbar content-wrap d-flex">
        <div class="navbar-content d-flex">
          <a href="index.html" class="logo d-flex">
            <img src="assets/images/logo.svg" alt="Organick" />
            <span>Organick</span>
          </a>

          <button
            type="button"
            id="iconBlock"
            class="menu-icon"
            aria-label="Меню"
          >
            <div id="iconOpen" class="menu-icon-open">
              <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </div>
            <div id="iconClose" class="menu-icon-close d-none">
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </div>
          </button>

          <ul id="mainMenu" class="main-menu d-flex">
            <li><a href="index.html">Головна</a></li>
            <li><a href="aboutus.html">Про нас</a></li>
            <li>
              <a href="404.html">
                Сторінки
                <img
                  class="icon-page"
                  src="assets/images/icons/arrow.svg"
                  alt="Стрілка"
                />
              </a>
            </li>
            <li><a href="shop.html">Магазин</a></li>
            <li><a href="404.html">Проєкти</a></li>
            <li><a href="contact.html">Контакти</a></li>
          </ul>

          <div class="top-panel">
            <form
              class="search-box"
              role="search"
              action="shop.html"
              method="get"
            >
              <input
                id="headerSearch"
                name="search"
                type="search"
                placeholder="Пошук товарів"
                aria-label="Пошук товарів"
                autocomplete="off"
              />
              <button type="submit" class="search-btn" aria-label="Пошук">
                <i class="fa-solid fa-magnifying-glass"></i>
              </button>
            </form>
            <div class="cart-box">
              <div class="cart-icon">
                <i class="fa-solid fa-shopping-cart"></i>
              </div>
              <span>Кошик (0)</span>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main class="admin">
      <h1 class="admin-title">Адмін-панель</h1>
      <p class="admin-status" id="adminStatus">Перевірка доступу…</p>

      <div class="admin-panel" id="adminPanel" hidden>
        <form class="admin-form" id="productForm" novalidate>
          <h2 class="admin-subtitle" id="formTitle">Новий товар</h2>
          <input type="hidden" id="productId" />

          <label for="fName">Назва *</label>
          <input id="fName" type="text" required />

          <label for="fCategory">Категорія *</label>
          <select id="fCategory" required></select>

          <div class="admin-row">
            <div>
              <label for="fPrice">Ціна, $ *</label>
              <input id="fPrice" type="number" min="0" step="0.01" required />
            </div>
            <div>
              <label for="fOldPrice">Стара ціна, $</label>
              <input id="fOldPrice" type="number" min="0" step="0.01" />
            </div>
          </div>

          <label for="fImage">Шлях до зображення</label>
          <input
            id="fImage"
            type="text"
            placeholder="assets/images/tomato.webp"
          />

          <label for="fDescription">Короткий опис</label>
          <textarea id="fDescription" rows="2"></textarea>

          <label for="fDetails">Повний опис</label>
          <textarea id="fDetails" rows="4"></textarea>

          <div class="admin-row">
            <div>
              <label for="fWeight">Вага</label>
              <input id="fWeight" type="text" placeholder="500 г" />
            </div>
            <div>
              <label for="fOrigin">Країна</label>
              <input id="fOrigin" type="text" placeholder="Україна" />
            </div>
          </div>

          <label for="fShelf">Термін придатності</label>
          <input id="fShelf" type="text" placeholder="7 діб" />

          <p class="admin-message" id="formMessage" role="status"></p>

          <div class="admin-buttons">
            <button type="submit" class="admin-btn" id="saveBtn">
              Додати товар
            </button>
            <button
              type="button"
              class="admin-btn admin-btn-light"
              id="cancelBtn"
              hidden
            >
              Скасувати
            </button>
          </div>
        </form>

        <section class="admin-list">
          <h2 class="admin-subtitle">
            Товари (<span id="productCount">0</span>)
          </h2>

          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Фото</th>
                  <th>Назва</th>
                  <th>Категорія</th>
                  <th>Ціна</th>
                  <th>Дії</th>
                </tr>
              </thead>
              <tbody id="productRows"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <script src="assets/js/main.js"></script>
    <script type="module" src="assets/js/auth.js"></script>
    <script type="module" src="assets/js/admin.js"></script>
  </body>
</html>
